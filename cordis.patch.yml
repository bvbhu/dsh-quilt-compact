# dsh-quilt-compact bundle layer.
#
# Replaces the `compaction` backend in BOTH profile families, with one file:
#
# 1) HOST-PLANE profiles (headless, sdk, sdk-minimal, custom no-web profiles):
#    the `compaction-basic` service entry on the host plane is disabled and
#    dsh-quilt-compact is mounted in its place, exactly as before. This branch
#    applies to every profile whose name is NOT web/desktop (see the !!js gate
#    on the insert row). The package itself must stay installed either way —
#    the chain's session-model fallback imports its `summarize()` directly
#    (see lib/default-compression.js).
#
# 2) WEB / DESKTOP profiles (dsh --profile web): the host plane does not own
#    compaction — `dsh-web-app` disables the host rows and the STANDARD agent
#    preset re-mounts the backend inside its `compaction` group (isolate realm,
#    per-agent). That group's `compaction-basic` row is swapped for
#    dsh-quilt-compact by restating the `preset-standard` row below; a patch
#    replaces the WHOLE config, so the full plugin list is restated (generated
#    from the shipped standard.patch.yml, regenerable via
#    `node tools/generate-preset-restate.mjs`).
#
# Both branches are live in the same file because the target rows differ per
# profile: in a web profile the `preset-standard` row exists (restate applies)
# and the host-plane insert is disabled by its !!js gate; in a headless/sdk
# profile the opposite holds. A profile with BOTH enabled would run two
# compaction engines over the same agent events — never do that.
#
# Rows are referenced by installed package name (not a relative source path) so
# Node resolves the installed copy.

# --- host-plane branch -------------------------------------------------------
# Disable the base leaf's default backend for profiles that own compaction on
# the host plane. (In web/desktop profiles this row is already disabled by
# dsh-web-app and the preset group is the real backend, so this is inert there.)
- id: compaction-basic
  disabled: true

- insert:
    - id: dsh-quilt-compact
      name: 'dsh-quilt-compact'
      # Web/desktop profiles run the backend inside the agent preset, not here;
      # enabling this host-plane row there would fight the preset's engine over
      # the same agent events. This mirrors dsh-web-app's own
      # `disabled: !!js "!ctx.get('profileContext')"` idiom.
      disabled: !!js "['web', 'desktop'].includes(ctx.get('profileContext')?.name)"
      config:
        # Fraction of a model context window one chunk may occupy.
        chunkRatio: 0.8
        # Overlap between adjacent chunks, as a fraction of the chunk budget.
        chunkOverlapRatio: 0.1
        # Session-model fallback when every pool tier is cooled.
        fallbackToSessionModel: true
        # Optional suffixes appended to the chunk / merge prompts.
        chunkPromptSuffix: ''
        mergePromptSuffix: ''

        # Ordered model pool. Each route key (`provider/model`) must be unique
        # across the whole pool; `cooldown` is required and exactly one mode:
        # `duration` (positive hours, decimals allowed) or `dailyReset`
        # (integer UTC hour 0-23). `maxConcurrent` defaults to 1.
        #
        # NOTE for web/desktop profiles: the pool the agents actually use is
        # the COPY embedded in the preset-standard restate below (the swap tool
        # copies this exact config into it), so edit BOTH here and in the
        # restate, or re-run tools/generate-preset-restate.mjs after changing
        # this block.
        tiers:
          - name: primary
            models:
              - provider: openrouter
                model: openrouter/free
                maxConcurrent: 1
                cooldown: { mode: dailyReset, hour: 0 }

        # Stage 0 preprocessing over the replayed region.
        preprocessing:
          dedup: true
          purgeErrors: true
          astSkeleton: { enabled: true, maxDepth: 2 }
          logCondense: { mode: balanced, maxLines: 200 }

# --- web/desktop branch: preset-standard restate ---
# --- preset-standard full restate (web/desktop profiles) ----------------
# Shipped by @deepseek-ai/dsh-web-app as presets/standard.patch.yml.
# Overriding the row replaces its WHOLE config (never deep-merged), so the
# full plugin list is restated VERBATIM with one change: the compaction
# group's backend row is dsh-quilt-compact instead of
# @deepseek-ai/dsh-compaction-basic. The group keeps isolate +
# command-compact + tool-result-pruner untouched; the dsh-quilt-compact
# row carries the same config as the host-plane row, regenerated by
# tools/generate-preset-restate.mjs so the two copies cannot drift.
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          suffix: Your working directory is {{cwd}}.
          prefix: You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: dsh-quilt-compact
            name: 'dsh-quilt-compact'
            config:
              # Fraction of a model context window one chunk may occupy.
              chunkRatio: 0.8
              # Overlap between adjacent chunks, as a fraction of the chunk budget.
              chunkOverlapRatio: 0.1
              # Session-model fallback when every pool tier is cooled.
              fallbackToSessionModel: true
              # Optional suffixes appended to the chunk / merge prompts.
              chunkPromptSuffix: ''
              mergePromptSuffix: ''
              # Ordered model pool. Each route key (`provider/model`) must be unique
              # across the whole pool; `cooldown` is required and exactly one mode:
              # `duration` (positive hours, decimals allowed) or `dailyReset`
              # (integer UTC hour 0-23). `maxConcurrent` defaults to 1.
              #
              # NOTE for web/desktop profiles: the pool the agents actually use is
              # the COPY embedded in the preset-standard restate below (the swap tool
              # copies this exact config into it), so edit BOTH here and in the
              # restate, or re-run tools/generate-preset-restate.mjs after changing
              # this block.
              tiers:
                - name: primary
                  models:
                    - provider: openrouter
                      model: openrouter/free
                      maxConcurrent: 1
                      cooldown: { mode: dailyReset, hour: 0 }
              # Stage 0 preprocessing over the replayed region.
              preprocessing:
                dedup: true
                purgeErrors: true
                astSkeleton: { enabled: true, maxDepth: 2 }
                logCondense: { mode: balanced, maxLines: 200 }
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
              backgroundMode: continuable
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable
          - id: tool-subagent-codex
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: codex
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: claude-code
              toolName: subagent_claude_code
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            disabled: true
            config:
              subagentProvider: spawn
              maxRounds: 64
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true

